# Базовые настройки окна
remember_window_size   yes
initial_window_width   1200
initial_window_height  800
enabled_layouts        tall,stack

# Шрифт (рекомендую Nerd Font для иконок, например JetBrainsMono)
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        9.0

# Отступы внутри терминала (воздух)
window_padding_width 15
window_padding_height 10

# Black
color0 #45475a
color8 #585b70
# Red
color1 #f38ba8
color9 #f38ba8
# Green
color2 #a6e3a1
color10 #a6e3a1
# Yellow
color3 #f9e2af
color11 #f9e2af
# Blue
color4 #89b4fa
color12 #89b4fa
# Magenta
color5 #cba6f7
color13 #cba6f7
# Cyan
color6 #94e2d5
color14 #94e2d5
# White
color7 #bac2de
color15 #a6adc8

# Динамическое изменение прозрачности при фокусе/потере фокуса
dynamic_background_opacity yes
background_opacity 0.5

# Убираем жирный шрифт для ссылок
disable_ligatures never

# Скрываем полосу прокрутки
scrollback_lines 2000
hide_window_decorations titlebar-only 
scrollback_indicator_opacity 0.0

# Cursor
cursor_shape block
cursor_blink_interval 0
cursor_trail 3

# Копировать в буфер обмена (Ctrl+Shift+C)
map ctrl+shift+c copy_to_clipboard
# Вставить (Ctrl+Shift+V)
map ctrl+shift+v paste_from_clipboard
# Классическое выделение мышью с копированием
copy_on_select yes

# Vi-режим для навигации (Shift+Insert или F7)
map f7 vi_mode

# Переключение раскладок (tall/stack)
map f1 next_layout

